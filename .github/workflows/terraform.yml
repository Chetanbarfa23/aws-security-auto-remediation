name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Install Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::438546837574:role/GitHubActionsSecurityAutomationRole
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. Verify AWS authentication
      # --------------------------------------------------------

      - name: Check AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # 5. Terraform initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 6. Terraform formatting check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check


      # --------------------------------------------------------
      # 7. Terraform validation
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 8. Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan