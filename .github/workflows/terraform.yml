name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GitHub Actions Permissions
# ============================================================

permissions:
  id-token: write
  contents: read


jobs:

  # ============================================================
  # CI - Terraform Plan
  # ============================================================

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Install Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # 3. Debug OIDC Token Claims
      # --------------------------------------------------------

      - name: Debug OIDC token claims
        shell: bash
        working-directory: .
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "OIDC TOKEN CLAIMS:"
          echo "$TOKEN" | cut -d "." -f2 | base64 -d 2>/dev/null || true


      # --------------------------------------------------------
      # 4. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::438546837574:role/GitHubActionsSecurityAutomationRole
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 5. Verify AWS authentication
      # --------------------------------------------------------

      - name: Check AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # 6. Build Lambda deployment package
      # --------------------------------------------------------

      - name: Build Lambda package
        working-directory: .
        run: |
          rm -f terraform/lambda_function.zip
          cd lambda
          zip -j ../terraform/lambda_function.zip handler.py


      # --------------------------------------------------------
      # 7. Verify Lambda package
      # --------------------------------------------------------

      - name: Verify Lambda package
        run: |
          ls -lh lambda_function.zip
          unzip -l lambda_function.zip


      # --------------------------------------------------------
      # 8. Terraform initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 9. Terraform formatting check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check


      # --------------------------------------------------------
      # 10. Terraform validation
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 11. Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # --------------------------------------------------------
      # 12. Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan
          path: terraform/tfplan
          if-no-files-found: error


      # --------------------------------------------------------
      # 13. Upload Lambda package
      # --------------------------------------------------------

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4

        with:
          name: lambda-package
          path: terraform/lambda_function.zip
          if-no-files-found: error


  # ============================================================
  # CD - Terraform Apply
  # ============================================================

  apply:

    # ----------------------------------------------------------
    # Apply ONLY after a push to main.
    #
    # Pull Requests can plan but cannot deploy.
    # ----------------------------------------------------------

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: terraform

    runs-on: ubuntu-latest


    # ----------------------------------------------------------
    # Production Environment
    # ----------------------------------------------------------

    environment:
      name: production


    defaults:
      run:
        working-directory: terraform


    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Install Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # 3. Debug OIDC Token Claims
      # --------------------------------------------------------

      - name: Debug OIDC token claims
        shell: bash
        working-directory: .
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "OIDC TOKEN CLAIMS:"
          echo "$TOKEN" | cut -d "." -f2 | base64 -d 2>/dev/null || true


      # --------------------------------------------------------
      # 4. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::438546837574:role/GitHubActionsSecurityAutomationRole
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 5. Verify AWS authentication
      # --------------------------------------------------------

      - name: Check AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # 6. Terraform initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 7. Download Terraform Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4

        with:
          name: terraform-plan
          path: terraform


      # --------------------------------------------------------
      # 8. Download Lambda package
      # --------------------------------------------------------

      - name: Download Lambda package
        uses: actions/download-artifact@v4

        with:
          name: lambda-package
          path: terraform


      # --------------------------------------------------------
      # 9. Verify Terraform Plan
      # --------------------------------------------------------

      - name: Verify Terraform Plan
        run: ls -lh tfplan


      # --------------------------------------------------------
      # 10. Verify Lambda package
      # --------------------------------------------------------

      - name: Verify Lambda package
        run: |
          ls -lh lambda_function.zip
          unzip -l lambda_function.zip


      # --------------------------------------------------------
      # 11. Apply the exact Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan