name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GitHub Actions Permissions
# ============================================================

permissions:
  id-token: write
  contents: read


jobs:

  # ============================================================
  # CI - Terraform Plan
  # ============================================================

  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Install Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::438546837574:role/GitHubActionsSecurityAutomationRole
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. Verify AWS authentication
      # --------------------------------------------------------

      - name: Check AWS identity
        run: aws sts get-caller-identity

      # --------------------------------------------------------
      # 5. Build Lambda deployment package
      # --------------------------------------------------------
      #
      # GitHub Actions creates the ZIP.
      #
      # Source:
      # lambda/handler.py
      #
      # Output:
      # terraform/lambda_function.zip
      # --------------------------------------------------------

      - name: Build Lambda package
        working-directory: .
        run: |
          rm -f terraform/lambda_function.zip
          cd lambda
          zip -j ../terraform/lambda_function.zip handler.py


      # --------------------------------------------------------
      # 6. Verify Lambda package
      # --------------------------------------------------------

      - name: Verify Lambda package
        run: |
          ls -lh lambda_function.zip
          unzip -l lambda_function.zip


      # --------------------------------------------------------
      # 7. Terraform initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 8. Terraform formatting check
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check


      # --------------------------------------------------------
      # 9. Terraform validation
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # 10. Terraform Plan
      # --------------------------------------------------------
      #
      # Terraform uses the ZIP created above.
      # --------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # --------------------------------------------------------
      # 11. Upload exact Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan
          path: terraform/tfplan
          if-no-files-found: error


      # --------------------------------------------------------
      # 12. Upload exact Lambda package
      # --------------------------------------------------------

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4

        with:
          name: lambda-package
          path: terraform/lambda_function.zip
          if-no-files-found: error


  # ============================================================
  # CD - Terraform Apply
  # ============================================================

  apply:

    # ----------------------------------------------------------
    # Apply ONLY after a push to main.
    #
    # Pull Requests can plan but cannot deploy.
    # ----------------------------------------------------------

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: terraform

    runs-on: ubuntu-latest


    # ----------------------------------------------------------
    # Production Environment
    # ----------------------------------------------------------

    environment:
      name: production


    defaults:
      run:
        working-directory: terraform


    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Install Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::438546837574:role/GitHubActionsSecurityAutomationRole
          aws-region: ap-south-1


      # --------------------------------------------------------
      # 4. Verify AWS authentication
      # --------------------------------------------------------

      - name: Check AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # 5. Terraform initialization
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # 6. Download exact Terraform Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4

        with:
          name: terraform-plan
          path: terraform


      # --------------------------------------------------------
      # 7. Download exact Lambda package
      # --------------------------------------------------------

      - name: Download Lambda package
        uses: actions/download-artifact@v4

        with:
          name: lambda-package
          path: terraform


      # --------------------------------------------------------
      # 8. Verify Terraform Plan
      # --------------------------------------------------------

      - name: Verify Terraform Plan
        run: ls -lh tfplan


      # --------------------------------------------------------
      # 9. Verify Lambda package
      # --------------------------------------------------------

      - name: Verify Lambda package
        run: |
          ls -lh lambda_function.zip
          unzip -l lambda_function.zip


      # --------------------------------------------------------
      # 10. Apply the exact approved Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
